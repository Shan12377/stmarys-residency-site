<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Think Like a Pharmacist</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#1d2733;--muted:#5d6b7a;--line:#d5dce4;--bar:#1f3b5a;--accent:#2f6fb0;--ok:#1e7a46;--okbg:#e6f4ec;--bad:#b3261e;--badbg:#fbe9e7;--warn:#9a5b00;--warnbg:#fff4e0;--chip:#e7edf4}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--panel:#1b222b;--ink:#e6ebf1;--muted:#9aa7b5;--line:#2c3642;--bar:#0f2238;--accent:#6aa5e0;--ok:#4cc184;--okbg:#16301f;--bad:#ff7b72;--badbg:#3a1a18;--warn:#f0b35a;--warnbg:#3a2a10;--chip:#232c37}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
header{background:var(--bar);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
header b{font-size:17px}header a{color:#cfe2ff}
main{max-width:860px;margin:0 auto;padding:14px 16px 90px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.on{background:var(--chip);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}.small{font-size:13px}
.tag{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12.5px;margin:0 6px 6px 0}
h2{font-size:20px;margin:4px 0 8px}h3{font-size:15px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table.chart{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0}
table.chart td{border-top:1px solid var(--line);padding:5px 8px;vertical-align:top}
table.chart td:first-child{color:var(--muted);width:34%}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:9px}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.why{font-size:14.5px;margin:4px 0 0;color:var(--ink)}
.box{border-left:4px solid var(--accent);background:var(--chip);border-radius:8px;padding:10px 12px;margin:10px 0}
.box.where{border-color:var(--warn);background:var(--warnbg)}
.box.call{border-color:var(--ok);background:var(--okbg)}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:9px;padding:10px;cursor:pointer;background:var(--panel)}
.card:hover{border-color:var(--accent)}
select{max-width:100%}
.wk details{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:6px 0;background:var(--panel)}
.wk summary{cursor:pointer;font-weight:600}
.wk h4{margin:10px 0 2px}
.wk .qa summary{font-weight:500}
.lv{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;margin-left:6px;border:1px solid var(--line)}
.lv.F{background:var(--okbg)}.lv.T{background:var(--badbg)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--line)}
.dot.g{background:var(--ok)}.dot.r{background:var(--bad)}.dot.y{background:var(--warn)}
#fpill{position:fixed;right:12px;bottom:12px;z-index:6;border-radius:22px;padding:9px 14px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.25);background:var(--panel)}
#fpill.on{background:var(--accent);color:#fff;border-color:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(37,99,235,.25)}}
#focus{position:fixed;left:8px;right:8px;bottom:64px;max-width:460px;margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;z-index:6;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#focus[hidden]{display:none}
input[type=range]{width:110px}
a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <b>🧠 Think Like a Pharmacist</b>
  <span class="small">Case questions that walk you to the answer · <a href="/">Back to the residency</a></span>
</header>
<main>
  <div class="panel">
    <div class="row">
      <label class="small muted" for="mod">Module</label>
      <select id="mod"></select>
      <span class="small muted">Mode</span>
      <span class="row" id="modes"></span>
    </div>
    <div class="row" style="margin-top:6px"><span class="small muted">Level</span><span class="row" id="levels"></span></div>
    <div id="summary" class="small muted" style="margin-top:8px"></div>
  </div>
  <div id="view"></div>
</main>
<button id="fpill" aria-controls="focus">🎧 Focus sound</button>
<div id="focus" hidden>
  <b style="flex:1">🎧 Focus sound</b><button id="fclose" aria-label="Close">✕ Close</button>
  <div style="flex-basis:100%"></div>
  <select id="snd" aria-label="Focus sound">
    <option value="">Off</option><option value="brown">Brown noise (deep, steady)</option><option value="pink">Pink noise (softer)</option>
    <option value="white">White noise</option><option value="rain">Rain</option>
    <option value="theta">528 Hz + 6 Hz theta beat (headphones)</option><option value="theta_brown">528 Hz theta beat + soft brown noise (headphones)</option>
    <option value="alpha">528 Hz + 10 Hz alpha beat (headphones)</option><option value="40">40 Hz gamma beat (headphones)</option>
  </select>
  <button class="primary" id="fplay">▶ Play</button>
  <label class="small">Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.6"></label>
  <span class="small muted" id="sndnote">Beats need stereo headphones (both ears). Noise blocks distractions; evidence that tones boost memory is limited.</span>
  <label class="small" style="flex-basis:100%"><input type="checkbox" id="readq"> Read questions aloud</label>
</div>
<script>
// ponytail: progress lives in this browser (localStorage) with export/import; move to Cloudflare KV if she wants phone + Mac sync.
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const KEY = 'qbank_progress_v1', DAY = 864e5, BOX = [0, 1, 3, 7, 21, 60];
let prog = {}; try { prog = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch {} };
let DRUGS = {}, modules = [], mod = null, mode = 'tutor', cur = null, lvl = '';
const LV = { 'Foundation': 'F', 'Staff': 'S', 'Top 10%': 'T' };

const MODES = [['tutor','Tutor'],['timed','Timed'],['missed','Missed'],['due','Due for review'],['browse','All cases']];
$('#modes').innerHTML = MODES.map(([k, t]) => `<button data-m="${k}">${t}</button>`).join('');
$('#modes').onclick = e => { const m = e.target.dataset.m; if (m) { mode = m; home(); } };
$('#levels').innerHTML = [['', 'All'], ['Foundation', 'Foundation'], ['Staff', 'Staff'], ['Top 10%', 'Top 10%']].map(([k, t]) => `<button data-l="${k}">${t}</button>`).join('');
$('#levels').onclick = e => { const l = e.target.dataset.l; if (l !== undefined) { lvl = l; home(); } };

async function load() {
  modules = await fetch('/qbank/index.json').then(r => r.json());
  DRUGS = await fetch('/qbank/drugs.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({}));
  $('#mod').innerHTML = modules.map(m => `<option value="${m.id}">${esc(m.title)} (${m.count})</option>`).join('');
  const want = new URLSearchParams(location.search).get('m');
  if (want) $('#mod').value = want;
  $('#mod').onchange = () => open($('#mod').value);
  open($('#mod').value);
}
async function open(id) {
  mod = await fetch(`/qbank/${id}.json`, { cache: 'no-cache' }).then(r => r.json());
  history.replaceState(null, '', `?m=${id}`); home();
}
const pk = c => `${mod.id}/${c.id}`;
const stat = c => prog[pk(c)];
function summary() {
  const cs = mod.cases, seen = cs.filter(stat), right = seen.filter(c => stat(c).last === 1);
  const due = cs.filter(c => stat(c) && stat(c).due <= Date.now()).length;
  const topics = {};
  for (const c of seen) for (const t of c.topics || []) { const o = topics[t] ||= [0, 0]; o[0] += stat(c).last; o[1]++; }
  const weak = Object.entries(topics).map(([t, [s, n]]) => [t, s / n, n]).sort((a, b) => a[1] - b[1]).slice(0, 4)
    .map(([t, p, n]) => `${esc(t)} ${Math.round(p * 100)}%`).join(' · ');
  const avg = seen.length ? seen.reduce((a, c) => a + stat(c).last, 0) / seen.length : 0;
  const tip = seen.length < 5 ? '' : avg >= .85 ? '<br><b>Tip:</b> you are scoring ' + Math.round(avg * 100) + '% here. Move up to <b>Top 10%</b> cases.' : avg < .6 ? '<br><b>Tip:</b> you are scoring ' + Math.round(avg * 100) + '% here. Lock in the <b>Foundation</b> cases first.' : '';
  $('#summary').innerHTML = `${seen.length} of ${cs.length} cases done · ${right.length} fully right · ${due} due for review` + tip +
    (weak ? `<br>Weakest topics: ${weak}` : '') +
    ` · <a href="#" id="exp">Export progress</a> · <a href="#" id="imp">Import</a>`;
  $('#exp').onclick = e => { e.preventDefault(); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(prog)], { type: 'application/json' })); a.download = 'qbank_progress.json'; a.click(); };
  $('#imp').onclick = e => { e.preventDefault(); const i = document.createElement('input'); i.type = 'file'; i.accept = '.json'; i.onchange = async () => { try { Object.assign(prog, JSON.parse(await i.files[0].text())); save(); home(); } catch { alert('That file could not be read.'); } }; i.click(); };
}
function pool() {
  const cs = mod.cases.filter(c => !lvl || c.level === lvl);
  if (mode === 'missed') return cs.filter(c => stat(c) && stat(c).last < 1);
  if (mode === 'due') return cs.filter(c => stat(c) && stat(c).due <= Date.now());
  return cs;
}
function home() {
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  document.querySelectorAll('#levels button').forEach(b => b.classList.toggle('on', b.dataset.l === lvl));
  summary(); stopSpeak();
  const list = pool();
  const intro = { tutor: 'Explanations appear after every step. Best for learning a topic the first time.',
    timed: 'A clock runs for each step and explanations wait until the case is done, like a real shift.',
    missed: 'Only the cases you did not get fully right last time.', due: 'Cases scheduled to come back today (spaced repetition: 1, 3, 7, 21, then 60 days).',
    browse: 'Every case in this module. Pick any one.' }[mode];
  const dot = c => { const s = stat(c); return s ? (s.last === 1 ? 'g' : s.last >= .5 ? 'y' : 'r') : ''; };
  $('#view').innerHTML = `<div class="panel"><h2>${esc(mod.title)}</h2><p class="muted" style="margin:0 0 8px">${md(mod.intro || '')}</p>
    <p class="small">${intro}</p>
    ${list.length ? `<p><button class="primary" id="go">Start ${mode === 'browse' ? 'first' : 'next'} case</button></p>` : '<p><b>Nothing here yet.</b> Do some cases in Tutor or Timed mode first.</p>'}
    <div class="grid">${list.map((c, n) => `<div class="card" data-i="${mod.cases.indexOf(c)}"><span class="dot ${dot(c)}"></span><b>${esc(c.title)}</b>${c.level ? `<span class="lv ${LV[c.level]}">${esc(c.level)}</span>` : ''}<div class="small muted">${esc((c.topics || []).join(' · '))}</div></div>`).join('')}</div></div>`;
  $('#view').querySelectorAll('.card').forEach(el => el.onclick = () => start(mod.cases[+el.dataset.i]));
  const go = $('#go'); if (go) go.onclick = () => start(pick(list));
}
function pick(list) {
  if (mode === 'browse') return list[0];
  const unseen = list.filter(c => !stat(c));
  return (unseen.length ? unseen : list)[0];
}
// Shuffle answer order every time a case starts, so position never gives the answer away.
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function start(c0) {
  const c = { ...c0, steps: c0.steps.map(st => ({ ...st, options: shuffle(st.options) })) };
  cur = { c, step: 0, firstTry: [], picked: null, done: false, timer: null };
  renderStep();
}
function header(c) {
  const chart = c.chart ? `<table class="chart">${Object.entries(c.chart).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${md(v)}</td></tr>`).join('')}</table>` : '';
  return `<div class="small muted">${esc(c.setting || '')}</div><h2>${esc(c.title)}${c.level ? ` <span class="lv ${LV[c.level]}">${esc(c.level)}</span>` : ''}</h2>
    <div>${(c.topics || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    <p>${md(c.stem)}</p>${chart}`;
}
const CHECK = ['Indication and goal: why is this drug ordered, and is it the right drug?', 'Approved dose for this indication, and the source (label vs guideline)', 'Weight based or fixed? Which weight (actual, ideal, adjusted)?', 'Show the math for this patient, including rate and volume', 'Route, rate limits, dilution, line and pump (compatibility)', 'Kidney and liver function: adjust?', 'Contraindications, boxed warnings, allergy, pregnancy and breastfeeding', 'Interactions and duplicates', 'Monitoring: what, when, target, toxicity signs', 'Antidote or rescue plan', 'What if the patient changes (kidneys, no IV, allergy, NPO)?', 'Alternatives: other routes, other drugs, second line', 'Who to call, what to say, what to document', 'What St. Mary\'s protocol says'];
function workup(c, open) {
  const w = c.workup, cards = (w ? w.drugs : []).map(d => DRUGS[d]).filter(Boolean);
  const src = x => `<li>${esc(x.mark || '')} ${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.t)}</a>` : esc(x.t)}</li>`;
  return `<div class="wk"><h3>📋 Full pharmacist workup</h3>
    ${w && w.calc ? `<details ${open ? 'open' : ''}><summary>This patient: dose check and math</summary><p>${md(w.calc)}</p></details>` : ''}
    ${w && w.whatif && w.whatif.length ? `<details ${open ? 'open' : ''}><summary>What if... (think first, then tap)</summary>${w.whatif.map(([q, a]) => `<details class="qa"><summary>${md(q)}</summary><p>${md(a)}</p></details>`).join('')}</details>` : ''}
    ${cards.map(k => `<details><summary>📘 ${esc(k.title)}</summary>${k.sections.map(([h, t]) => `<h4>${esc(h)}</h4><p>${md(t)}</p>`).join('')}<ol class="small">${k.sources.map(src).join('')}</ol></details>`).join('')}
    <details ${cards.length ? '' : 'open'}><summary>${cards.length ? 'The 14 point checklist I run on every order' : 'Your 14 point workup (full drug card for this case coming soon)'}</summary><ol>${CHECK.map(x => `<li>${esc(x)}</li>`).join('')}</ol></details></div>`;
}
// ponytail: options reshuffle on every render so the right answer never sits in a predictable spot.
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function renderStep() {
  const { c, step } = cur, s = c.steps[step], multi = s.type === 'multi';
  clearInterval(cur.timer);
  cur.picked = new Set(); cur.answered = false;
  $('#view').innerHTML = `<div class="panel">${header(c)}
    <div class="prog"><i style="width:${(step / c.steps.length) * 100}%"></i></div>
    <div class="small muted">Step ${step + 1} of ${c.steps.length}${s.kind ? ' · ' + esc(s.kind) : ''}${multi ? ' · choose all that apply' : ''}<span id="clock"></span></div>
    <p style="font-weight:600;margin:6px 0">${md(s.q)}</p>
    <div id="opts">${shuffle(s.options.map((o, i) => i)).map(i => `<button class="opt" data-i="${i}">${md(s.options[i].t)}<div class="why" hidden></div></button>`).join('')}</div>
    <div id="after"></div>
    <p class="row"><button class="primary" id="submit">Check answer</button>${mode !== 'timed' ? '<button id="wkbtn">📋 Full workup</button>' : ''}<button id="quit">Back to list</button></p>
    <div id="wkbox" hidden>${mode !== 'timed' ? workup(c, true) : ''}</div></div>`;
  if ($('#wkbtn')) $('#wkbtn').onclick = () => { $('#wkbox').hidden = !$('#wkbox').hidden; };
  $('#opts').onclick = e => {
    const b = e.target.closest('.opt'); if (!b || cur.answered) return;
    const i = +b.dataset.i;
    if (multi) { cur.picked.has(i) ? cur.picked.delete(i) : cur.picked.add(i); }
    else cur.picked = new Set([i]);
    $('#opts').querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', cur.picked.has(+x.dataset.i)));
  };
  $('#submit').onclick = check;
  $('#quit').onclick = home;
  if (mode === 'timed') {
    let left = s.seconds || (multi ? 90 : 60);
    const tick = () => { $('#clock') && ($('#clock').textContent = ` · ⏱ ${left}s`); if (left-- <= 0) { clearInterval(cur.timer); check(); } };
    tick(); cur.timer = setInterval(tick, 1000);
  }
  if ($('#readq').checked) speak(`${step === 0 ? c.stem + '. ' : ''}${s.q}. ` + [...document.querySelectorAll('#opts .opt')].map((b, n) => `Option ${n + 1}. ${s.options[+b.dataset.i].t}`).join('. '));
}
function check() {
  if (cur.answered) return next();
  clearInterval(cur.timer);
  const { c, step } = cur, s = c.steps[step];
  const right = new Set(s.options.map((o, i) => o.correct ? i : -1).filter(i => i >= 0));
  const ok = right.size === cur.picked.size && [...right].every(i => cur.picked.has(i));
  cur.firstTry[step] = ok; cur.answered = true;
  const showWhy = mode !== 'timed';
  $('#opts').querySelectorAll('.opt').forEach(b => {
    const i = +b.dataset.i, o = s.options[i];
    const cls = o.correct ? 'right' : (cur.picked.has(i) ? 'wrong' : ''); if (cls) b.classList.add(cls);
    if (showWhy && o.why) { const w = b.querySelector('.why'); w.hidden = false; w.innerHTML = (o.correct ? '✅ ' : '✗ ') + md(o.why); }
  });
  $('#after').innerHTML = (ok ? '<p style="color:var(--ok);font-weight:600">Correct.</p>' : '<p style="color:var(--bad);font-weight:600">Not quite. The highlighted answers are right.</p>') +
    (showWhy && s.teach ? `<div class="box"><b>How a pharmacist thinks:</b><br>${md(s.teach)}</div>` : '') +
    (showWhy && s.where ? `<div class="box where"><b>Where to find it / who to ask:</b><br>${md(s.where)}</div>` : '');
  $('#submit').textContent = step + 1 < c.steps.length ? 'Next step' : 'Finish case';
  if ($('#readq').checked && showWhy) speak((ok ? 'Correct. ' : 'Not quite. ') + (s.teach || ''));
}
function next() { cur.step + 1 < cur.c.steps.length ? (cur.step++, renderStep()) : finish(); }
function finish() {
  const { c } = cur, score = cur.firstTry.filter(Boolean).length / c.steps.length;
  const s = prog[pk(c)] || { box: 0 };
  s.box = score === 1 ? Math.min(s.box + 1, BOX.length - 1) : 0;
  s.last = Math.round(score * 100) / 100; s.seen = (s.seen || 0) + 1; s.due = Date.now() + BOX[s.box] * DAY + (s.box ? 0 : 6 * 36e5);
  prog[pk(c)] = s; save();
  const review = mode === 'timed' ? c.steps.map((st, i) => `<div class="box"><b>Step ${i + 1}: ${md(st.q)}</b> ${cur.firstTry[i] ? '✅' : '✗'}<br>${st.options.filter(o => o.correct).map(o => '✅ ' + md(o.t)).join('<br>')}${st.teach ? '<br><br>' + md(st.teach) : ''}</div>`).join('') : '';
  $('#view').innerHTML = `<div class="panel">${header(c)}
    <p style="font-size:18px"><b>Score: ${Math.round(score * 100)}%</b> ${score === 1 ? '🎯 Top 10% thinking.' : score >= .6 ? 'Solid. Review the steps you missed.' : 'Weak spot. This case will come back soon.'}</p>
    ${review}
    ${c.call ? `<div class="box call"><b>The call (SBAR), word for word:</b><br>${md(c.call)}</div>` : ''}
    ${c.monitor ? `<h3>Monitor</h3><p>${md(c.monitor)}</p>` : ''}
    ${c.pearl ? `<h3>Memory hook</h3><p>${md(c.pearl)}</p>` : ''}
    ${c.alternatives ? `<h3>If first line is not an option</h3><p>${md(c.alternatives)}</p>` : ''}
    ${workup(c, true)}
    ${c.sources ? `<h3>Sources</h3><ol class="small">${c.sources.map(x => `<li>${esc(x.mark || '')} ${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.t)}</a>` : esc(x.t)}</li>`).join('')}</ol>` : ''}
    <p class="small muted">Teaching case, invented. Check St. Mary's order sets and policies before acting.</p>
    <p class="row"><button class="primary" id="nx">Next case</button><button id="again">Redo this case</button><button id="list">Back to list</button></p></div>`;
  if ($('#readq').checked) speak([c.call, c.pearl].filter(Boolean).join('. '));
  $('#nx').onclick = () => { const l = pool().filter(x => x.id !== c.id); l.length ? start(pick(l)) : home(); };
  $('#again').onclick = () => start(mod.cases.find(x => x.id === c.id)); $('#list').onclick = home;
  scrollTo(0, 0);
}

// Read aloud: browser voice, one sentence at a time (Chrome goes silent on long text).
function speak(t) {
  stopSpeak();
  const plain = String(t).replace(/\*\*/g, '').replace(/[✅✗]/g, '');
  const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
  const v = vs.find(v => /premium|enhanced|natural|google us|samantha|ava|allison/i.test(v.name)) || vs[0];
  for (const p of plain.split(/(?<=[.!?;:])\s+/).flatMap(x => x.match(/.{1,220}(\s|$)/g) || [])) {
    const u = new SpeechSynthesisUtterance(p); if (v) u.voice = v; speechSynthesis.speak(u);
  }
}
function stopSpeak() { try { speechSynthesis.cancel(); } catch {} }

// Focus sounds, generated in the browser (free, nothing downloaded).
// Routed through an <audio> element so phones treat it as media: it plays with the silent switch on and through Bluetooth.
let ac, gain, nodes = [], out, player;
function stopNodes() { nodes.forEach(n => { try { n.stop ? n.stop() : 0; } catch {} try { n.disconnect(); } catch {} }); nodes = []; }
function tone(f, ch, merger, level) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.value = level; o.connect(g); g.connect(merger, 0, ch); o.start(); nodes.push(o, g); }
function noise(kind, level) {
  const len = ac.sampleRate * 4, buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch); let last = 0, b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (kind === 'white') d[i] = w * .4;
      else if (kind === 'pink') { b0 = .99886 * b0 + w * .0555179; b1 = .99332 * b1 + w * .0750759; b2 = .969 * b2 + w * .153852; b3 = .8665 * b3 + w * .3104856; b4 = .55 * b4 + w * .5329522; b5 = -.7616 * b5 - w * .016898; d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * .5362) * .09; b6 = w * .115926; }
      else { last = (last + .02 * w) / 1.02; d[i] = last * 3.2; }
      if (kind === 'rain' && Math.random() < .0009) d[i] += (Math.random() - .5) * .6;
    }
  }
  const src = ac.createBufferSource(), g = ac.createGain(); src.buffer = buf; src.loop = true; g.gain.value = level;
  let o = src; if (kind === 'rain') { const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 400; src.connect(f); o = f; nodes.push(f); }
  o.connect(g); g.connect(gain); src.start(); nodes.push(src, g);
}
function beat(carrier, diff, level) { const m = ac.createChannelMerger(2); tone(carrier, 0, m, level); tone(carrier + diff, 1, m, level); m.connect(gain); nodes.push(m); }
function sound(kind) {
  stopNodes();
  if (!kind) { if (player) player.pause(); $('#sndnote').textContent = 'Beats need stereo headphones (both ears). Noise blocks distractions; evidence that tones boost memory is limited.'; return; }
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  ac ||= new (window.AudioContext || window.webkitAudioContext)();
  if (!gain) {
    gain = ac.createGain();
    if (ac.createMediaStreamDestination) { out = ac.createMediaStreamDestination(); gain.connect(out); player = new Audio(); player.srcObject = out.stream; }
    else gain.connect(ac.destination);
  }
  gain.gain.value = +$('#vol').value;
  ac.resume();
  if (kind === 'theta') beat(528, 6, .5);
  else if (kind === 'theta_brown') { beat(528, 6, .45); noise("brown", .6); }
  else if (kind === 'alpha') beat(528, 10, .5);
  else if (kind === '40') beat(200, 40, .5);
  else noise(kind, 1);
  if (player) player.play().catch(() => { gain.disconnect(); gain.connect(ac.destination); });
  $('#sndnote').textContent = /theta|alpha|40/.test(kind)
    ? 'Playing. Left ear and right ear get slightly different tones; the beat only forms with stereo headphones (some Bluetooth headsets switch to mono during calls). Turn the phone volume up if it is faint.'
    : 'Playing. Turn the phone volume up if it is faint.';
}
let playing = false;
function setPlaying(on) {
  playing = on; $('#fplay').textContent = on ? '■ Stop' : '▶ Play';
  $('#fpill').classList.toggle('on', on); $('#fpill').textContent = on ? '🎧 Playing · tap to stop or change' : '🎧 Focus sound';
}
$('#fpill').onclick = () => { $('#focus').hidden = !$('#focus').hidden; };
$('#fclose').onclick = () => { $('#focus').hidden = true; };
$('#fplay').onclick = () => { if (playing) { sound(''); setPlaying(false); } else { if (!$('#snd').value) $('#snd').value = 'theta'; sound($('#snd').value); setPlaying(true); } };
$('#snd').onchange = e => { if (!e.target.value) { sound(''); setPlaying(false); } else if (playing) sound(e.target.value); };
$('#vol').oninput = e => { if (gain) gain.gain.value = +e.target.value; };
load().catch(() => { $('#view').innerHTML = '<div class="panel">The question bank could not load. Refresh the page.</div>'; });

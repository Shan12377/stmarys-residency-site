<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#1d2733;--muted:#5d6b7a;--line:#cfd6df;--bar:#1f3b5a;--bar2:#2d5279;--accent:#2f6fb0;--ok:#1e7a46;--bad:#b3261e;--warn:#a15c00;--chip:#e3e9f1}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--panel:#1b222b;--ink:#e6ebf1;--muted:#9aa7b5;--line:#2c3642;--bar:#0f2238;--bar2:#18324f;--accent:#6aa5e0;--ok:#4cc184;--bad:#ff7b72;--warn:#e3a54a;--chip:#26303b}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--bar);color:#fff;padding:8px 14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header b{font-size:15px}header .sp{flex:1}header .score{background:var(--bar2);padding:4px 10px;border-radius:4px}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:10px;padding:10px;max-width:1300px;margin:0 auto}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.queue h3,.panel h3{margin:0;padding:8px 10px;font-size:13px;background:var(--chip);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.qi{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}.qi:hover{background:var(--chip)}.qi.sel{border-left:4px solid var(--accent);background:var(--chip)}
.qi small{color:var(--muted);display:block}.tag{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--chip);margin-left:4px}.tag.stat{background:var(--bad);color:#fff}
.done-ok{color:var(--ok)}.done-bad{color:var(--bad)}
.banner{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 14px;padding:10px;border-bottom:3px solid var(--accent);background:var(--panel)}
.banner div span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}
.allergy{color:var(--bad);font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--line);flex-wrap:wrap}.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font:inherit}.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.tabc{padding:12px;min-height:150px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted)}
.flag{color:var(--bad);font-weight:600}
.order{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--chip)}
.order .rx{font-size:16px;font-weight:600}
.label{font-family:ui-monospace,Menlo,monospace;border:2px dashed var(--muted);padding:10px;border-radius:6px;white-space:pre-wrap;background:var(--panel)}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:10px;border-top:1px solid var(--line)}
.actions button{padding:9px 14px;border-radius:5px;border:1px solid var(--line);cursor:pointer;font:inherit;font-weight:600;background:var(--panel);color:var(--ink)}
.b-ok{border-color:var(--ok)!important;color:var(--ok)!important}.b-mod{border-color:var(--warn)!important;color:var(--warn)!important}.b-rej{border-color:var(--bad)!important;color:var(--bad)!important}
textarea{width:100%;min-height:60px;padding:8px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);font:inherit}
.fb{margin:10px;padding:12px;border-radius:6px;border:1px solid var(--line)}.fb.right{border-color:var(--ok)}.fb.wrong{border-color:var(--bad)}
.fb h4{margin:0 0 6px}.ref{font-size:12px;color:var(--muted)}.ref a{color:var(--accent)}
.hint{font-size:12px;color:var(--muted);padding:0 10px 10px}
a{color:var(--accent)}
</style>
</head>

 let body="";
 if(tab==="order")body=`<div class="order"><div class="ref">${c.type} · ${c.stat?'STAT':'Routine'}</div><div class="rx">${c.order}</div></div>${c.label?`<p><b>Product label</b></p><div class="label">${c.label}</div>`:''}`;
 if(tab==="labs")body=`<table><tr><th>Result</th><th>Value</th><th></th></tr>${c.labs.map(l=>`<tr><td>${l[0]}</td><td class="${l[2]?'flag':''}">${l[1]}</td><td class="flag">${l[2]}</td></tr>`).join('')}</table>`;
 if(tab==="meds")body=c.meds.length?`<ul>${c.meds.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="ref">No active medications listed.</p>';
 if(tab==="notes")body=`<p>${c.notes||'No notes.'}</p>`;
 m.innerHTML=`<div class="banner"><div><span>Patient</span><b>${p.name}</b></div><div><span>MRN</span>${p.mrn}</div><div><span>Age / Sex</span>${p.age} / ${p.sex}</div><div><span>Weight / Height</span>${p.wt} / ${p.ht}</div><div><span>Allergies</span><span class="allergy">${p.allergy}</span></div><div><span>Location</span>${p.loc}</div><div><span>Diagnosis</span>${p.dx}</div></div>
 <div class="tabs">${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div><div class="tabc">${body}</div>
 ${r?fb(c,r):`<div style="padding:0 10px"><textarea id="why" placeholder="Your reasoning and what you would say to the prescriber (required)"></textarea></div>
 <div class="actions"><button class="b-ok" onclick="act('verify')">Verify</button><button class="b-mod" onclick="act('modify')">Modify / contact prescriber</button><button class="b-rej" onclick="act('reject')">Reject / do not dispense</button></div>`}`}
function act(a){const t=document.getElementById('why').value.trim();if(!t){alert('Write your reasoning first.');return}const c=CASES[st.sel];st.res[c.id]={a,right:a===c.answer,t};draw()}
function fb(c,r){const name={verify:"Verify",modify:"Modify / contact prescriber",reject:"Reject / do not dispense"};
 return `<div class="fb ${r.right?'right':'wrong'}"><h4>${r.right?'Correct':'Not quite'}: you chose ${name[r.a]}; best action is ${name[c.answer]}.</h4><p>${c.why}</p><p class="ref">Your reasoning: ${r.t.replace(/</g,'&lt;')}</p><p class="ref">Study page: <a href="${c.ref[1]}" target="_top">${c.ref[0]}</a></p><button onclick="delete st.res[${c.id}];draw()">Try again</button> <button onclick="next()">Next order</button></div>`}
function next(){st.sel=(st.sel+1)%CASES.length;tab="order";draw()}
draw();
</script>
</body>
</html>

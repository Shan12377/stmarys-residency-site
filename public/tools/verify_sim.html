<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cerner PharmNet · Order Verification Simulator</title>
<style>
:root{
  --bg:#e8edf3;--panel:#ffffff;--panel2:#f5f8fc;--ink:#15202b;--muted:#526273;
  --line:#c8d2de;--bar:#102a43;--bar2:#1f3b5a;--accent:#1d63b8;--accent-soft:#e1effe;
  --ok:#157347;--ok-soft:#e6f4ea;--bad:#b91c1c;--bad-soft:#fce8e6;--warn:#b45309;--warn-soft:#fef3c7;
  --chip:#e3e9f1;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d131a;--panel:#161f29;--panel2:#1c2733;--ink:#e6edf5;--muted:#94a3b8;
    --line:#2a3747;--bar:#091726;--bar2:#132a42;--accent:#58a6ff;--accent-soft:#162c46;
    --ok:#3fb950;--ok-soft:#122d1f;--bad:#f85149;--bad-soft:#36181a;--warn:#f59e0b;--warn-soft:#33240d;
    --chip:#222f3e;
  }
}
*{box-sizing:border-box}
body{margin:0;font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}

/* Top Cerner PharmNet App Bar */
header{
  background:linear-gradient(90deg,var(--bar),var(--bar2));color:#fff;
  padding:8px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:50;
}
header .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.01em}
header .badge-ehr{background:#0ea5e9;color:#fff;font-size:11px;padding:2px 7px;border-radius:3px;font-weight:700;text-transform:uppercase}
header .sub{font-size:12px;opacity:.85}
header .sp{flex:1}
header .stat-pill{background:rgba(255,255,255,.12);padding:4px 10px;border-radius:4px;font-size:12.5px;font-weight:600}
header .nav-btn{color:#fff;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:4px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.22);cursor:pointer}
header .nav-btn:hover{background:rgba(255,255,255,.24);text-decoration:none}

/* Main 3-Column Cerner Layout */
.workspace{
  display:grid;grid-template-columns:270px 1fr 370px;gap:10px;
  padding:10px;max-width:1680px;margin:0 auto;align-items:start;
}
@media(max-width:1220px){.workspace{grid-template-columns:250px 1fr}}
@media(max-width:860px){.workspace{grid-template-columns:1fr}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ph{
  margin:0;padding:7px 10px;font-size:11.5px;font-weight:700;
  background:var(--chip);border-bottom:1px solid var(--line);
  text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  display:flex;justify-content:space-between;align-items:center;
}

/* Queue Column */
.filter-bar{padding:8px;border-bottom:1px solid var(--line);display:flex;gap:4px;flex-wrap:wrap;background:var(--panel2)}
.fbtn{
  font-size:11px;padding:3px 7px;border-radius:4px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;font-weight:600;
}
.fbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.queue-list{max-height:calc(100vh - 210px);overflow-y:auto}
.qi{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
.qi:hover{background:var(--panel2)}
.qi.sel{border-left:4px solid var(--accent);background:var(--accent-soft)}
.qi-top{display:flex;justify-content:space-between;align-items:center;gap:4px;font-weight:600;font-size:13px}
.qi small{color:var(--muted);display:block;font-size:11.5px;margin-top:2px}
.tag{font-size:10.5px;padding:1px 5px;border-radius:3px;background:var(--chip);font-weight:700;display:inline-block}
.tag.stat{background:var(--bad);color:#fff}
.tag.calc{background:var(--warn);color:#fff}
.tag.svc{background:var(--bar2);color:#fff}
.done-ok{color:var(--ok);font-weight:700}
.done-bad{color:var(--bad);font-weight:700}

/* Patient Demographic Banner (Cerner style) */
.pt-banner{
  background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--accent);
  border-radius:6px;padding:10px 12px;margin-bottom:10px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px 12px;
}
.pt-cell span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.03em}
.pt-cell b{font-size:14px}
.pt-name{font-size:15.5px!important;color:var(--accent)}
.allergy-bad{color:var(--bad);font-weight:700;background:var(--bad-soft);padding:1px 6px;border-radius:3px;display:inline-block}
.allergy-ok{color:var(--ok);font-weight:600}

/* Incoming Order Box */
.order-card{
  border:2px solid var(--accent);border-radius:6px;background:var(--panel);margin-bottom:10px;overflow:hidden;
}
.order-head{
  background:var(--accent-soft);padding:7px 12px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;
}
.order-rx{padding:12px;font-size:16px;font-weight:700;line-height:1.4}
.label-box{
  margin:0 12px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  border:2px dashed var(--muted);padding:10px 12px;border-radius:6px;white-space:pre-wrap;background:var(--panel2);
}

/* Simultaneous Clinical Chart Grid (Labs + Meds + Notes all visible) */
.chart-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:720px){.chart-grid{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;font-size:13px}
th{font-size:11px;color:var(--muted);text-transform:uppercase;background:var(--panel2)}
.flag-h,.flag-l{color:var(--bad);font-weight:700;background:var(--bad-soft);padding:0 5px;border-radius:3px;font-size:11.5px}
.med-list{margin:0;padding:8px 12px 8px 26px;font-size:13px}
.med-list li{margin-bottom:4px}
.notes-body{padding:10px 12px;font-size:13.5px;margin:0}

/* Right Column: Calc Pad & Sign-off */
.calc-req-box{
  border:2px solid var(--warn);background:var(--warn-soft);border-radius:6px;padding:10px;margin-bottom:10px;
}
.calc-req-box h4{margin:0 0 6px;font-size:13px;color:var(--warn);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.calc-row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.calc-row input{
  flex:1;min-width:100px;padding:7px 9px;border:1px solid var(--line);border-radius:4px;
  font:600 14px inherit;background:var(--panel);color:var(--ink);
}
.btn-sm{
  padding:6px 10px;border-radius:4px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;
}
.btn-sm:hover{background:var(--chip)}
.calc-res{margin-top:6px;font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:4px}
.calc-res.ok{background:var(--ok-soft);color:var(--ok)}
.calc-res.bad{background:var(--bad-soft);color:var(--bad)}

/* Built-in Clinical Calculator Scratchpad */
.scratchpad{padding:10px;border-bottom:1px solid var(--line);background:var(--panel2)}
.sp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.sp-grid label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.sp-grid input,.sp-grid select{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit}
.sp-out{margin-top:6px;padding:6px 8px;background:var(--panel);border:1px solid var(--line);border-radius:4px;font-size:12px}

/* 6-Point Checklist */
.chk-list{padding:8px 10px;border-bottom:1px solid var(--line);display:grid;gap:4px;font-size:12.5px}
.chk-list label{display:flex;gap:7px;align-items:center;cursor:pointer}
.chk-list input{accent-color:var(--ok);width:15px;height:15px}

/* SBAR & Sign-Off */
.sign-area{padding:10px}
textarea{
  width:100%;min-height:72px;padding:8px;border:1px solid var(--line);border-radius:5px;
  background:var(--panel);color:var(--ink);font:inherit;resize:vertical;
}
.actions{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.actions button{
  padding:9px 12px;border-radius:5px;border:2px solid transparent;cursor:pointer;
  font:700 13.5px inherit;text-align:left;display:flex;justify-content:space-between;align-items:center;
}
.b-ok{background:var(--ok-soft);border-color:var(--ok)!important;color:var(--ok)}
.b-mod{background:var(--warn-soft);border-color:var(--warn)!important;color:var(--warn)}
.b-rej{background:var(--bad-soft);border-color:var(--bad)!important;color:var(--bad)}
.actions button:hover{filter:brightness(.96)}

/* Feedback Modal / Panel */
.fb{margin-top:10px;padding:12px;border-radius:6px;border:2px solid var(--line);background:var(--panel)}
.fb.right{border-color:var(--ok);background:var(--ok-soft)}
.fb.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb h4{margin:0 0 6px;font-size:15px}
.fb-box{background:var(--panel);color:var(--ink);padding:9px 11px;border-radius:5px;border:1px solid var(--line);margin-top:8px;font-size:13px}
.fb-box b{display:block;font-size:11.5px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="badge-ehr">Cerner PharmNet</span><span>Inpatient Order Verification &amp; IV Room Workbench</span></div>
  <span class="sub">St. Mary's Virtual Residency · Invented Teaching Patients · Dr. Shallanda Hunter, PharmD, MBA, RPh, CFNMP</span>
  <span class="sp"></span>
  <span class="stat-pill" id="score">Verified: 0 / 0</span>
  <a class="nav-btn" href="/tools/intervention_log" target="_blank">My Intervention Log</a>
  <a class="nav-btn" href="/">Residency Home</a>
</header>

<div class="workspace">
  <!-- LEFT: Verification Queue -->
  <div class="panel">
    <div class="ph"><span>Pending Verification Queue</span><span id="qcount">50</span></div>
    <div class="filter-bar" id="filters"></div>
    <div class="queue-list" id="queue"></div>
  </div>

  <!-- CENTER: Patient Banner + Simultaneous Chart + Order -->
  <div id="center-col"></div>

  <!-- RIGHT: Calculation Pad + 6-Point Check + RPh Sign-Off -->
  <div class="panel" id="right-col"></div>
</div>

   answer:"modify",
   why:"Per the PAUSE trial and CHEST 2022 guidelines: for a high-bleed-risk surgery on apixaban, skip 2 days before surgery and the day of surgery (last dose 3 days before), and DO NOT bridge a DOAC with heparin/enoxaparin (bridging increases major bleeding without reducing clots).",

   ref:["Anticoagulation","/clinical/anticoagulation_core"]},

   ref:["Anticoagulation","/clinical/anticoagulation_core"]},

  {id:24,svc:"IV Room",type:"IV room",stat:false,title:"Product check: 10-fold heparin rate error",
   pt:{name:"TEST, XRAY",mrn:"SIM0024",age:57,sex:"M",wt:80,ht:178,allergy:"NKDA",loc:"4 West 402",dx:"DVT"},
   labs:[],meds:[],notes:"Verified Order: Heparin 18 units/kg/h (1,440 units/h), using premix 25,000 units in 250 mL (100 units/mL).",
   order:"Verify the label below against the order.",
   label:"PATIENT: TEST, XRAY   MRN SIM0024\nHEPARIN 25,000 units in 250 mL (100 units/mL)\nDose: 1,440 units/h\nRATE: 144 mL/h\nCheck: tech [AB]  RPh [Pending]",
   calc:{label:"Calculate the correct pump rate in mL/h for 1,440 units/h using a 100 units/mL bag:",unit:"mL/h",ans:14.4,tol:0.2,formula:"1,440 units/h / 100 units/mL = 14.4 mL/h (label says 144 mL/h, a 10-fold overdose!)."},
   answer:"reject",
   why:"1,440 units/h divided by 100 units/mL equals 14.4 mL/h, NOT 144 mL/h. That missing decimal point is a classic 10-fold heparin overdose (14,400 units/h).",
   sbar:"Reject label: Rate on label is 144 mL/h instead of 14.4 mL/h (1,440 units/h / 100 units/mL = 14.4 mL/h). Reprint label with 14.4 mL/h.",
   ref:["Heparin","/drug-hub/monographs/heparin"]},

  {id:25,svc:"ICU/Trauma",type:"IV room",stat:true,title:"Product check: norepinephrine rate math",
   pt:{name:"TEST, YANKEE",mrn:"SIM0025",age:63,sex:"F",wt:70,ht:163,allergy:"NKDA",loc:"MICU 2",dx:"Septic shock"},
   labs:[["MAP","58 mmHg","L",">=65 mmHg"]],meds:["Central line in place"],notes:"Order: Norepinephrine 4 mg in D5W 250 mL, start at 5 mcg/min, titrate to MAP >= 65.",
   order:"Verify the label below against the order.",
   label:"PATIENT: TEST, YANKEE   MRN SIM0025\nNOREPINEPHRINE 4 mg in 5% Dextrose 250 mL (16 mcg/mL)\nStart 5 mcg/min = 18.8 mL/h\nTitrate to MAP 65 or higher\nCheck: tech [KL]  RPh [Pending]",

   sbar:"Verified STAT norepinephrine 4 mg/250 mL D5W (16 mcg/mL) starting at 5 mcg/min (18.8 mL/h).",
   ref:["Norepinephrine","/drug-hub/monographs/norepinephrine"]},

  {id:26,svc:"IV Room",type:"IV room",stat:true,title:"Product check: phenytoin diluent & rate",
   pt:{name:"TEST, ZULU",mrn:"SIM0026",age:44,sex:"M",wt:80,ht:180,allergy:"NKDA",loc:"ED Bay 3",dx:"Status epilepticus"},
   labs:[],meds:[],notes:"Order: Phenytoin 1,600 mg IV loading dose once (20 mg/kg).",
   order:"Verify the compounded product below against the order.",
   label:"PATIENT: TEST, ZULU   MRN SIM0026\nPHENYTOIN 1,600 mg\nin 5% Dextrose 100 mL\nInfuse over 30 minutes\nCheck: tech [MM]  RPh [Pending]",
   calc:{label:"What is the shortest safe infusion time in minutes for 1,600 mg of phenytoin at the max adult rate of 50 mg/min?",unit:"min",ans:32,tol:1,formula:"1,600 mg / 50 mg/min = 32 minutes minimum (and must be in Normal Saline, never D5W!)."},
   answer:"reject",
   why:"Two fatal errors: (1) Phenytoin has a pH of ~12 and immediately precipitates into solid white crystals in acidic D5W (must use Normal Saline only with a 0.22 micron filter), and (2) 1,600 mg over 30 minutes is 53.3 mg/min, exceeding the 50 mg/min maximum rate (propylene glycol causes severe hypotension and arrhythmias).",
   sbar:"Reject bag: Remake phenytoin 1,600 mg in 0.9% NaCl (never D5W), dispense with a 0.22 micron in-line filter, and set infusion time to at least 32 to 40 minutes (max 50 mg/min) with continuous ECG/BP monitoring.",
   ref:["IV Compatibility","/drug-hub/iv_compatibility"]},

  {id:27,svc:"IV Room",type:"IV room",stat:false,title:"Product check: liposomal amphotericin diluent",
   pt:{name:"TEST, AMBER",mrn:"SIM0027",age:52,sex:"F",wt:60,ht:163,allergy:"NKDA",loc:"Oncology 6",dx:"Invasive fungal infection"},
   labs:[],meds:[],notes:"Order: Amphotericin B liposomal (AmBisome) 300 mg IV daily.",
   order:"Verify the compounded product below against the order.",
   label:"PATIENT: TEST, AMBER   MRN SIM0027\nAMPHOTERICIN B LIPOSOMAL 300 mg\nin 0.9% Sodium Chloride 250 mL\nInfuse over 2 hours\nCheck: tech [MM]  RPh [Pending]",

   sbar:"Reject bag: Liposomal amphotericin B is incompatible with Normal Saline. Remake in D5W 250 mL and include instructions to flush line with D5W before and after infusion.",

  {id:28,svc:"IV Room",type:"IV room",stat:false,title:"Product check: nitroglycerin container",

  {id:29,svc:"ICU/Trauma",type:"Order",stat:false,title:"Amiodarone concentration on peripheral IV",
   pt:{name:"TEST, CORAL",mrn:"SIM0029",age:71,sex:"F",wt:70,ht:160,allergy:"NKDA",loc:"Step down 8",dx:"AF with RVR"},
   labs:[],meds:["Peripheral IV only"],notes:"",
   order:"Amiodarone 900 mg in 250 mL D5W (3.6 mg/mL), 1 mg/min x 6 h then 0.5 mg/min, via peripheral IV.",
   calc:{label:"Calculate the concentration in mg/mL of amiodarone 450 mg in 250 mL D5W for peripheral use (must be <= 2 mg/mL):",unit:"mg/mL",ans:1.8,tol:0.1,formula:"450 mg / 250 mL = 1.8 mg/mL (safe for peripheral IV, since peripheral limit is 2 mg/mL)."},
   answer:"modify",
   why:"Amiodarone concentrations above 2 mg/mL cause severe peripheral vein phlebitis and require a central line. At 3.6 mg/mL with only a peripheral IV, change to a peripheral-safe concentration of 1.8 mg/mL (450 mg in 250 mL D5W) or place a central line, with an in-line filter and non-PVC bag.",
   sbar:"S: Amiodarone 900 mg/250 mL (3.6 mg/mL) ordered via peripheral IV. B: Patient has no central line. A: Concentrations > 2 mg/mL require central access due to phlebitis risk. R: Recommend changing bag concentration to 450 mg in 250 mL D5W (1.8 mg/mL) with an in-line filter for peripheral infusion.",
   ref:["IV Compatibility","/drug-hub/iv_compatibility"]},

  {id:30,svc:"IV Room",type:"Order",stat:false,title:"Parenteral nutrition osmolarity on peripheral IV",
   pt:{name:"TEST, DELTA",mrn:"SIM0030",age:58,sex:"M",wt:72,ht:175,allergy:"NKDA",loc:"4 East 404",dx:"Postoperative ileus"},
   labs:[["Calculated PN osmolarity","1,450 mOsm/L","H","<=900 mOsm/L peripheral"]],meds:["Peripheral IV only"],notes:"",
   order:"Parenteral nutrition (dextrose 20%, amino acids 5%) via peripheral IV at 80 mL/h.",
   answer:"modify",
   why:"Peripheral parenteral nutrition (PPN) is limited to 900 mOsm/L or less. At 1,450 mOsm/L, infusing into a peripheral vein causes severe phlebitis, thrombosis, and extravasation necrosis. Requires central venous access (PICC/CVC) or reformulation to <= 900 mOsm/L.",
   sbar:"S: Central-strength TPN (1,450 mOsm/L) ordered via peripheral IV. B: Patient only has peripheral access. A: Peripheral limit is 900 mOsm/L. R: Recommend holding until PICC/central line is confirmed or reformulating to a peripheral PN <= 900 mOsm/L.",
   ref:["IV Compatibility","/drug-hub/iv_compatibility"]},

  {id:31,svc:"IV Room",type:"IV room",stat:false,title:"Product check: 3-in-1 lipid PN filter size",

  {id:34,svc:"IV Room",type:"IV room",stat:true,title:"Product check: Vincristine in a syringe",
   pt:{name:"TEST, HOTEL",mrn:"SIM0034",age:8,sex:"M",wt:26,ht:128,allergy:"NKDA",loc:"Peds Onc 2",dx:"Acute lymphoblastic leukemia"},

   sbar:"HARD STOP: Never dispense vincristine in a syringe. Re-compound in a 25 mL or 50 mL minibag with auxiliary warning label 'FOR INTRAVENOUS USE ONLY - FATAL IF GIVEN BY OTHER ROUTES' and hold separate from intrathecal medications.",
   ref:["IV Compatibility","/drug-hub/iv_compatibility"]},

  {id:35,svc:"ICU/Trauma",type:"Order",stat:true,title:"Propofol day 4 (PRIS check)",
   pt:{name:"TEST, INDIGO",mrn:"SIM0035",age:46,sex:"M",wt:90,ht:183,allergy:"NKDA",loc:"MICU 6",dx:"ARDS, mechanically ventilated"},
   labs:[["Triglycerides","620 mg/dL","H","<150"],["CK","2,400 U/L","H","30 to 200"],["Lactate","3.8 mmol/L","H","0.5 to 2.0"]],
   meds:["Propofol 75 mcg/kg/min IV (Day 4)","Norepinephrine 0.1 mcg/kg/min IV"],notes:"RASS goal 0 to -1. Current RASS -4.",
   order:"Continue propofol 75 mcg/kg/min IV.",
   calc:{label:"Convert propofol 75 mcg/kg/min to mg/kg/h (divide mcg/kg/min by 1,000 and multiply by 60):",unit:"mg/kg/h",ans:4.5,tol:0.1,formula:"75 mcg/kg/min x 60 min/h = 4,500 mcg/kg/h = 4.5 mg/kg/h (exceeds the 4 mg/kg/h PRIS threshold!)."},
   answer:"modify",
   why:"75 mcg/kg/min equals 4.5 mg/kg/h for 4 days (>48 hours) alongside norepinephrine, and the patient now has the classic triad of Propofol Infusion Syndrome (PRIS): lactic acidosis (3.8), rhabdomyolysis (CK 2,400), and hypertriglyceridemia (620), plus oversedation (RASS -4 vs goal 0 to -1). Stop propofol immediately and switch to analgesia-first + dexmedetomidine or midazolam.",
   sbar:"S: Propofol running at 75 mcg/kg/min (4.5 mg/kg/h) on Day 4 in MICU 6. B: Triglycerides 620, CK 2,400, lactate 3.8, on norepinephrine, RASS -4. A: Concerning for Propofol Infusion Syndrome (PRIS) and oversedation. R: Recommend discontinuing propofol immediately and transitioning to fentanyl + dexmedetomidine titrated to RASS 0 to -1.",
   ref:["Adult Critical Care","/clinical/adult_critical_care"]},

  {id:36,svc:"ICU/Trauma",type:"Order",stat:true,title:"Severe hyperkalemia with ECG changes",
   pt:{name:"TEST, JADE",mrn:"SIM0036",age:74,sex:"F",wt:52,ht:155,allergy:"NKDA",loc:"ED Bay 9",dx:"ESRD, missed hemodialysis"},
   labs:[["K","7.1 mEq/L","H","3.5 to 5.0"],["Glucose","96 mg/dL","","70 to 110"],["ECG","Peaked T waves, widened QRS","H","Normal sinus"]],
   meds:[],notes:"Anuric ESRD.",
   order:"Insulin regular 10 units IV once. Sodium zirconium cyclosilicate 10 g PO once.",
   answer:"modify",
   why:"Three critical problems: (1) With K 7.1 and ECG changes (peaked T waves, wide QRS), Step 1 is Calcium gluconate 1 g IV over 2 to 5 minutes to stabilize the myocardium immediately; (2) Giving IV insulin without Dextrose 25 g (50 mL D50W) when baseline glucose is 96 mg/dL will cause severe hypoglycemia; and (3) In renal failure/low weight (52 kg), 5 units of regular insulin is preferred over 10 units to prevent delayed hypoglycemia 3 to 6 hours later.",
   sbar:"S: Regular insulin 10 units IV + Lokelma 10 g PO ordered for K 7.1 with peaked T waves/wide QRS in ED Bay 9. B: Patient is 74 y/o, 52 kg, anuric ESRD, baseline glucose 96 mg/dL. A: Needs immediate cardiac membrane stabilization with calcium, dextrose to prevent hypoglycemia, and renal-adjusted insulin dose. R: Recommend adding calcium gluconate 1 g IV over 2 to 5 min STAT, adding Dextrose 50% 25 g (50 mL) IV, reducing regular insulin to 5 units IV, and ordering hourly fingerstick glucose checks for 6 hours.",
   ref:["Adult Critical Care","/clinical/adult_critical_care"]},

  {id:37,svc:"ICU/Trauma",type:"Order",stat:false,title:"3% saline speed limit in hyponatremia",
   pt:{name:"TEST, KIWI",mrn:"SIM0037",age:59,sex:"M",wt:62,ht:175,allergy:"NKDA",loc:"MICU 3",dx:"Chronic hyponatremia (Na 112), alcohol use disorder"},
   labs:[["Na","112 mEq/L","L","135 to 145"],["K","2.9 mEq/L","L","3.5 to 5.0"]],meds:[],notes:"Confused but awake, no seizures. Team note: 'Correct Na to 130 by tomorrow morning.'",
   order:"Sodium chloride 3% IV at 100 mL/h continuous infusion. Goal Na 130 mEq/L in 24 hours.",
   calc:{label:"What is the maximum safe 24-hour sodium rise (in mEq/L) for a high-risk patient (alcohol use disorder + hypokalemia)?",unit:"mEq/L",ans:8,tol:0,formula:"High-risk osmotic demyelination patients (alcohol use disorder, hypokalemia, malnutrition, liver disease): max 8 mEq/L rise per 24 hours (24-hour target Na <= 120 mEq/L, never 130!)."},
   answer:"modify",
   why:"Raising Na from 112 to 130 (+18 mEq/L in 24 h) will strip the brain's myelin sheath and cause irreversible Osmotic Demyelination Syndrome (ODS). With alcohol use disorder and hypokalemia (K 2.9), his maximum safe limit is 8 mEq/L in 24 hours (24-h ceiling Na 120 mEq/L). Also remember that K replacement itself raises serum osmolarity/Na!",
   sbar:"S: 3% NaCl at 100 mL/h ordered with a 24-hour Na goal of 130 mEq/L (from 112). B: History of alcohol use disorder and K 2.9 mEq/L; no seizures. A: An 18 mEq/L rise risks osmotic demyelination syndrome; high-risk limit is max 8 mEq/L per 24 hours (goal Na <= 120). R: Recommend stopping continuous 3% NaCl at 100 mL/h, setting a 24-hour Na cap of 118 to 120 mEq/L, repleting potassium (which also raises Na), and checking serum Na every 2 to 4 hours.",
   ref:["Adult Critical Care","/clinical/adult_critical_care"]},

  {id:38,svc:"ICU/Trauma",type:"Order",stat:false,title:"ICU insulin infusion target (NICE-SUGAR)",
   pt:{name:"TEST, LEMON",mrn:"SIM0038",age:66,sex:"F",wt:80,ht:165,allergy:"NKDA",loc:"SICU 2",dx:"Postoperative septic shock"},
   labs:[["Glucose","242 mg/dL","H","140 to 180"]],meds:[],notes:"",
   order:"Regular insulin IV infusion, titrate to target blood glucose 80 to 110 mg/dL.",
   answer:"modify",
   why:"In the NICE-SUGAR trial, tight glycemic control (81 to 108 mg/dL) in ICU patients increased 90-day mortality (27.5% vs 24.9%) and caused a 13-fold increase in severe hypoglycemia (6.8% vs 0.5%). ADA and AACE guidelines recommend a target range of 140 to 180 mg/dL.",
   sbar:"S: ICU insulin drip ordered with a target glucose of 80 to 110 mg/dL. B: Post-op septic shock in SICU 2. A: Per NICE-SUGAR and ADA/AACE guidelines, tight targets (80 to 110) increase hypoglycemia and mortality in critically ill patients. R: Recommend changing the insulin drip target range to 140 to 180 mg/dL per standard ICU protocol.",
   ref:["Adult Critical Care","/clinical/adult_critical_care"]},

  {id:39,svc:"ICU/Trauma",type:"Order",stat:true,title:"Adult DKA insulin + K below 3.5",
   pt:{name:"TEST, MANGO",mrn:"SIM0039",age:34,sex:"F",wt:70,ht:165,allergy:"NKDA",loc:"ED Bay 2",dx:"Severe DKA"},
   labs:[["Glucose","480 mg/dL","H","70 to 110"],["K","3.2 mEq/L","L","3.5 to 5.0"],["pH","7.18","L","7.35 to 7.45"],["Bicarbonate","11 mEq/L","L","22 to 29"],["Beta-hydroxybutyrate","5.4 mmol/L","H","<0.6"]],
   meds:["0.9% NaCl 1,000 mL/h IV"],notes:"2024 consensus DKA criteria met.",
   order:"Regular insulin 7 units/h IV continuous infusion (0.1 units/kg/h) STAT.",
   calc:{label:"What is the minimum serum potassium (in mEq/L) required before starting the 7 units/h insulin drip in adult DKA?",unit:"mEq/L",ans:3.5,tol:0,formula:"2024 Adult DKA Consensus: Hold insulin if K is below 3.5 mEq/L; give potassium about 10 mmol/h until K is above 3.5, then start fixed-rate regular insulin at 0.1 units/kg/h (7 units/h for 70 kg)."},
   answer:"modify",
   why:"Per the 2024 ADA/EASD Hyperglycemic Crises Consensus Report, when serum potassium is below 3.5 mEq/L (hers is 3.2), you must HOLD insulin and give IV potassium (about 10 mmol/h) until K is above 3.5 mEq/L to prevent fatal arrhythmias.",
   sbar:"S: Regular insulin 7 units/h IV drip ordered STAT for DKA in ED Bay 2. B: Baseline serum potassium is 3.2 mEq/L. A: Starting insulin when K is below 3.5 mEq/L drives K intracellularly and risks cardiac arrest (2024 DKA consensus). R: Recommend holding the insulin drip, starting IV potassium repletion now, and initiating regular insulin 7 units/h once repeat K is above 3.5 mEq/L.",
   ref:["Insulin IV DKA","/drug-hub/monographs/insulin_iv_dka"]},

  {id:40,svc:"L&D",type:"Order",stat:true,title:"Magnesium sulfate drip rate & renal cap",
   pt:{name:"TEST, NECTAR",mrn:"SIM0040",age:32,sex:"F",wt:84,ht:162,allergy:"NKDA",loc:"L&D 2",dx:"Preeclampsia with severe features + oliguria"},
   labs:[["BP","168/112 mmHg","H","<140/90"],["SCr","1.9 mg/dL","H","0.4 to 0.9"],["Urine output (last 4 h)","60 mL total","L",">=100 mL / 4 h"]],
   meds:["Labetalol 20 mg IV given"],notes:"Premixed magnesium bag is 40 g in 1,000 mL (40 mg/mL = 0.04 g/mL).",
   order:"Magnesium sulfate 6 g IV load over 20 minutes, then 2 g/h (50 mL/h) continuous IV infusion.",
   calc:{label:"For severe renal impairment/oliguria, FDA label reduces maintenance to 1 g/h. Using the 40 g/1,000 mL bag, what is 1 g/h in mL/h?",unit:"mL/h",ans:25,tol:0.5,formula:"40 g in 1,000 mL = 1 g per 25 mL. For severe renal impairment or oliguria, FDA label & ACOG use a 4 g load followed by 1 g/h (25 mL/h), max 20 g per 48 hours, with serum Mg levels."},
   answer:"modify",
   why:"Magnesium is 100% renally excreted. With SCr 1.9 mg/dL and oliguria (60 mL in 4 hours, below the 100 mL/4 h safety threshold), running 6 g load + 2 g/h will rapidly cause magnesium toxicity (loss of reflexes >4 mEq/L, respiratory paralysis ~10 mEq/L). Per the FDA label, use a 4 g load and 1 g/h maintenance (25 mL/h on a 40 g/1,000 mL bag), max 20 g over 48 hours, and check serum magnesium levels.",
   sbar:"S: Magnesium sulfate 6 g load + 2 g/h ordered for L&D 2. B: Patient has oliguria (60 mL/4 h) and SCr 1.9 mg/dL. A: High risk for respiratory paralysis from magnesium accumulation. R: Per FDA label and ACOG PB 222, recommend reducing to a 4 g IV load over 15 to 20 minutes followed by 1 g/h (25 mL/h), ordering serum magnesium levels every 4 to 6 hours, and keeping calcium gluconate 1 g IV at bedside.",
   ref:["Magnesium Sulfate","/drug-hub/monographs/magnesium_sulfate"]},

  {id:45,svc:"ID/Floor",type:"Order",stat:true,title:"Sepsis vancomycin loading dose & infusion rate",
   pt:{name:"TEST, SAGE",mrn:"SIM0045",age:61,sex:"M",wt:100,ht:180,allergy:"NKDA",loc:"ED Bay 1",dx:"Septic shock (MRSA bacteremia suspected)"},
   labs:[["SCr","2.2 mg/dL","H","0.7 to 1.3"],["Lactate","4.2 mmol/L","H","0.5 to 2.0"]],
   meds:["Norepinephrine 8 mcg/min IV","Cefepime 2 g IV STAT"],notes:"First dose for septic shock.",
   order:"Vancomycin 2,500 mg IV loading dose once, infuse over 60 minutes.",
   calc:{label:"At the maximum safe vancomycin infusion rate of 10 mg/min (or at least 60 min per 1,000 mg), what is the minimum infusion time in minutes for a 2,500 mg dose?",unit:"min",ans:250,tol:70,formula:"At max 10 mg/min: 2,500 mg / 10 mg/min = 250 minutes (or 150 to 240 minutes per hospital chart; never 60 minutes, which is 41.7 mg/min and triggers severe vancomycin infusion reaction!)."},
   answer:"modify",
   why:"The 2,500 mg (25 mg/kg actual body weight) loading dose is appropriate even in acute kidney injury to rapidly fill the volume of distribution in septic shock (2020 ASHP/IDSA consensus). However, infusing 2,500 mg over 60 minutes (41.7 mg/min) will cause severe histamine release (vancomycin infusion reaction / hypotension). Infuse at no more than 10 to 15 mg/min (at least 150 to 250 minutes).",
   sbar:"S: Vancomycin 2,500 mg IV loading dose ordered over 60 minutes in ED Bay 1. B: Patient is in septic shock on norepinephrine. A: The 25 mg/kg loading dose is appropriate for septic shock, but infusing 2,500 mg over 60 minutes exceeds the 10 mg/min max rate and can worsen hypotension via histamine release. R: Keep the 2,500 mg STAT loading dose, extend infusion time to 180 to 240 minutes, and dose maintenance by AUC/levels.",
   ref:["Vancomycin","/drug-hub/monographs/vancomycin"]},

  {id:46,svc:"ID/Floor",type:"Order",stat:false,title:"C. difficile route check (IV vs PO vancomycin)",
   pt:{name:"TEST, THYME",mrn:"SIM0046",age:69,sex:"F",wt:66,ht:162,allergy:"NKDA",loc:"3 East 310",dx:"Clostridioides difficile colitis (first episode)"},
   labs:[["WBC","16.4 K","H","4.5 to 11.0"],["SCr","1.0 mg/dL","","0.6 to 1.1"],["C. diff toxin EIA","Positive","H","Negative"]],
   meds:[],notes:"Taking oral liquids.",
   order:"Vancomycin 125 mg IV every 6 hours x 10 days.",

const FILTERS=["All","Needs Calc","STAT","L&D","NICU/PICU","Stroke","Anticoag","ICU/Trauma","ID/Floor","IV Room"];
let st={sel:0,filter:"All",res:{},calcOk:{}};
try{
  const saved=JSON.parse(localStorage.getItem("pharmnet_verify_v2")||"{}");
  if(saved.res)st.res=saved.res;
  if(saved.calcOk)st.calcOk=saved.calcOk;
}catch(e){}

function saveSt(){
  try{localStorage.setItem("pharmnet_verify_v2",JSON.stringify({res:st.res,calcOk:st.calcOk}))}catch(e){}
}

function visibleCases(){
  return CASES.map((c,i)=>({c,i})).filter(({c})=>{
    if(st.filter==="All")return true;
    if(st.filter==="Needs Calc")return !!c.calc;
    if(st.filter==="STAT")return !!c.stat;
    if(st.filter==="IV Room")return c.type==="IV room";
    return c.svc===st.filter;
  });
}

function ibwCalc(sex,htCm){
  const inches=htCm/2.54;
  const base=sex==="M"?50:45.5;
  const ibw=base+2.3*(inches-60);
  return Math.max(3,Math.round(ibw*10)/10);
}

function drawFilters(){
  const fb=document.getElementById("filters");
  fb.innerHTML=FILTERS.map(f=>`<button class="fbtn ${st.filter===f?'on':''}" onclick="setFilter('${f}')">${f}</button>`).join("");
}

function setFilter(f){
  st.filter=f;
  const vis=visibleCases();
  if(vis.length&&!vis.some(x=>x.i===st.sel))st.sel=vis[0].i;
  draw();
}

function drawQueue(){
  const vis=visibleCases();
  document.getElementById("qcount").textContent=`${vis.length} orders`;
  const q=document.getElementById("queue");
  q.innerHTML=vis.map(({c,i})=>{
    const r=st.res[c.id];
    const mark=r?(r.right?'<span class="done-ok">✔</span> ':'<span class="done-bad">✘</span> '):'';
    return `<div class="qi ${i===st.sel?'sel':''}" onclick="pick(${i})">
      <div class="qi-top"><span>${mark}#${c.id} ${c.title}</span></div>
      <div style="margin-top:3px;display:flex;gap:4px;flex-wrap:wrap">
        ${c.stat?'<span class="tag stat">STAT</span>':''}
        ${c.calc?'<span class="tag calc">CALC</span>':''}
        <span class="tag svc">${c.svc}</span>
        <span class="tag">${c.type}</span>
      </div>
      <small>${c.pt.name} · ${c.pt.loc}</small>
    </div>`;
  }).join("");
  const done=Object.values(st.res);
  document.getElementById("score").textContent=`Verified: ${done.filter(x=>x.right).length} / ${done.length} (of ${CASES.length})`;
}

function pick(i){st.sel=i;draw()}

function draw(){
  drawFilters();
  drawQueue();
  const c=CASES[st.sel],p=c.pt,r=st.res[c.id];
  const ageDisp=p.ageStr||`${p.age} y`;
  const isAdult=p.age>=18&&p.ht>=140;
  const ibw=isAdult?ibwCalc(p.sex,p.ht):null;
  const adjBw=(ibw&&p.wt>ibw*1.2)?Math.round((ibw+0.4*(p.wt-ibw))*10)/10:null;
  const scrLab=c.labs.find(l=>l[0].toLowerCase().includes("scr"));
  const crclLab=c.labs.find(l=>l[0].toLowerCase().includes("crcl"));

  // Center Column: Banner + Incoming Order + Simultaneous Chart
  const center=document.getElementById("center-col");
  center.innerHTML=`
    <div class="pt-banner">
      <div class="pt-cell"><span>Patient Name</span><b class="pt-name">${p.name}</b></div>
      <div class="pt-cell"><span>MRN / Unit</span><b>${p.mrn} · ${p.loc}</b></div>
      <div class="pt-cell"><span>Age / Sex</span><b>${ageDisp} / ${p.sex}</b></div>
      <div class="pt-cell"><span>Actual Wt / Ht</span><b>${p.wt} kg / ${p.ht} cm</b></div>
      <div class="pt-cell"><span>IBW ${adjBw?'/ AdjBW':''}</span><b>${ibw?`${ibw} kg${adjBw?' / '+adjBw+' kg':''}`:'Pediatric (use kg)'}</b></div>
      <div class="pt-cell"><span>Allergies</span><span class="${p.allergy==='NKDA'?'allergy-ok':'allergy-bad'}">${p.allergy}</span></div>
      <div class="pt-cell"><span>Primary Diagnosis</span><b>${p.dx}</b></div>
    </div>

    <div class="order-card">
      <div class="order-head">
        <div>
          <span class="tag ${c.stat?'stat':''}">${c.stat?'STAT PRIORITY':'ROUTINE'}</span>
          <span class="tag svc">${c.svc}</span>
          <b style="margin-left:6px">Unverified ${c.type}: #ORD-${1000+c.id}</b>
        </div>
        <span style="font-size:12px;color:var(--muted)">Status: <b>Pending Pharmacist Verification (RPh)</b></span>
      </div>
      <div class="order-rx">${c.order}</div>
      ${c.label?`<div class="label-box"><b>IV ROOM PRODUCT LABEL &amp; PULL-BACK CHECK:</b>\n${c.label}</div>`:''}
    </div>

    <div class="chart-grid">
      <div class="panel">
        <div class="ph"><span>Laboratory Results (Cerner Flowsheet)</span><span>Recent</span></div>
        ${c.labs.length?`<table><thead><tr><th>Lab</th><th>Result</th><th>Flag</th><th>Ref Range</th></tr></thead><tbody>
          ${c.labs.map(l=>`<tr><td><b>${l[0]}</b></td><td class="${l[2]?'flag-'+l[2].toLowerCase():''}">${l[1]}</td><td>${l[2]?`<span class="flag-${l[2].toLowerCase()}">${l[2]}</span>`:''}</td><td style="color:var(--muted);font-size:12px">${l[3]||''}</td></tr>`).join("")}
        </tbody></table>`:`<p class="notes-body" style="color:var(--muted)">No new laboratory results flagged for this check.</p>`}
      </div>

      <div style="display:grid;gap:10px">
        <div class="panel">
          <div class="ph"><span>Active Medication Profile (MAR)</span><span>Inpatient</span></div>
          ${c.meds.length?`<ul class="med-list">${c.meds.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<p class="notes-body" style="color:var(--muted)">No other active medications on profile.</p>`}
        </div>
        <div class="panel">
          <div class="ph"><span>Clinical Progress Notes / Lines &amp; Vitals</span><span>Chart</span></div>
          <p class="notes-body">${c.notes||'No additional clinical notes.'}</p>
        </div>
      </div>
    </div>
  `;

  // Right Column: Required Calculation + Scratchpad + 6-Point Check + Sign-Off
  const right=document.getElementById("right-col");
  const scrNum=scrLab?parseFloat(scrLab[1]):1.0;
  const calcDone=st.calcOk[c.id];

  right.innerHTML=`
    <div class="ph"><span>Pharmacist Verification &amp; Sign-Off</span><span>RPh</span></div>
    <div style="padding:10px">
      ${c.calc?`
        <div class="calc-req-box">
          <h4>🧮 Required Dosing / Rate Calculation</h4>
          <div style="font-size:13px;font-weight:600">${c.calc.label}</div>
          <div class="calc-row">
            <input type="number" step="any" id="calc-in" placeholder="Enter value (${c.calc.unit})" value="${calcDone!==undefined?calcDone:''}">
            <span style="font-size:12px;font-weight:700;color:var(--muted)">${c.calc.unit}</span>
            <button class="btn-sm" onclick="checkCalc(${c.id})">Check Math</button>
            <button class="btn-sm" onclick="toggleHint()">Formula</button>
          </div>
          <div id="calc-fb">${calcDone!==undefined?`<div class="calc-res ok">✔ Math verified (${calcDone} ${c.calc.unit}).<br><small>${c.calc.formula}</small></div>`:''}</div>
          <div id="calc-hint" style="display:none;margin-top:6px;font-size:12px;padding:6px;background:var(--panel);border-radius:4px;border:1px dashed var(--warn)">
            <b>Setup:</b> ${c.calc.formula}
          </div>
        </div>
      `:''}

      <details class="panel" style="margin-bottom:10px">
        <summary class="ph" style="cursor:pointer"><span>⚡ Built-In Clinical Calculator Scratchpad</span><span>Open / Close</span></summary>
        <div class="scratchpad">
          <div style="font-size:11.5px;font-weight:700;color:var(--muted)">1. QUICK MATH EXPRESSION (type e.g. 0.25 * 78 or 1440 / 100)</div>
          <div class="calc-row">
            <input type="text" id="expr-in" placeholder="e.g. 18 * 90 / 100" oninput="evalExpr()">
            <b id="expr-out" style="min-width:70px;text-align:right">= —</b>
          </div>
          <hr style="border:0;border-top:1px solid var(--line);margin:8px 0">
          <div style="font-size:11.5px;font-weight:700;color:var(--muted)">2. COCKCROFT-GAULT CrCl (auto-filled from banner)</div>
          <div class="sp-grid">
            <label>Age (y)<input type="number" id="cg-age" value="${isAdult?p.age:60}" oninput="runCG()"></label>
            <label>Sex<select id="cg-sex" onchange="runCG()"><option value="M" ${p.sex==='M'?'selected':''}>Male</option><option value="F" ${p.sex==='F'?'selected':''}>Female (x 0.85)</option></select></label>
            <label>Weight (kg)<input type="number" step="any" id="cg-wt" value="${p.wt}" oninput="runCG()"></label>
            <label>SCr (mg/dL)<input type="number" step="any" id="cg-scr" value="${scrNum||1.0}" oninput="runCG()"></label>
          </div>
          <div class="sp-out" id="cg-out"></div>
        </div>
      </details>

      <div class="panel" style="margin-bottom:10px">
        <div class="ph"><span>6-Point Pharmacist Pre-Sign Check</span><span>Tap as you verify</span></div>
        <div class="chk-list">
          <label><input type="checkbox"> 1. Indication &amp; guideline dose/ceiling verified</label>
          <label><input type="checkbox"> 2. Weight (kg) &amp; CrCl renal adjustment checked</label>
          <label><input type="checkbox"> 3. Critical labs checked (K, Plt, INR/aPTT, Na, Bili)</label>
          <label><input type="checkbox"> 4. No duplicate therapy, allergy, or contraindication</label>
          <label><input type="checkbox"> 5. Route, line (central vs periph), diluent &amp; filter safe</label>
          <label><input type="checkbox"> 6. Rate (mL/h), monitoring times &amp; USP 797 BUD right</label>
        </div>
      </div>

      ${r?renderFeedback(c,r):`
        <div class="sign-area" style="padding:0">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <b style="font-size:12px;color:var(--muted);text-transform:uppercase">Pharmacist Note / SBAR to Prescriber</b>
            <button class="btn-sm" style="padding:2px 7px;font-size:11px" onclick="insertSBAR()">+ Insert SBAR Template</button>
          </div>
          <textarea id="why" placeholder="Write your clinical rationale or SBAR recommendation before signing off..."></textarea>
          <div class="actions">
            <button class="b-ok" onclick="act('verify')"><span>✔ Verify &amp; Sign Order</span><small>RPh Sign-Off</small></button>
            <button class="b-mod" onclick="act('modify')"><span>✎ Modify / Contact Prescriber</span><small>Hold &amp; SBAR</small></button>
            <button class="b-rej" onclick="act('reject')"><span>✖ Reject / Do Not Dispense</span><small>Hard Stop</small></button>
          </div>
        </div>
      `}
    </div>
  `;
  runCG();
}

function evalExpr(){
  const raw=document.getElementById("expr-in").value.replace(/[^0-9+\-*/(). ]/g,"");
  const out=document.getElementById("expr-out");
  if(!raw.trim()){out.textContent="= —";return}
  try{
    const val=Function('"use strict";return ('+raw+')')();
    out.textContent=isFinite(val)?"= "+Math.round(val*1000)/1000:"= —";
  }catch(e){out.textContent="= —"}
}

function runCG(){
  const age=parseFloat(document.getElementById("cg-age")?.value)||0;
  const sex=document.getElementById("cg-sex")?.value||"M";
  const wt=parseFloat(document.getElementById("cg-wt")?.value)||0;
  const scr=parseFloat(document.getElementById("cg-scr")?.value)||0;
  const el=document.getElementById("cg-out");
  if(!el)return;
  if(age<=0||wt<=0||scr<=0){el.textContent="Enter age, weight, and SCr.";return}
  const crcl=((140-age)*wt)/(72*scr)*(sex==="F"?0.85:1);
  el.innerHTML=`<b>CrCl (using ${wt} kg): ${Math.round(crcl*10)/10} mL/min</b>`;
}

function toggleHint(){
  const h=document.getElementById("calc-hint");
  if(h)h.style.display=h.style.display==="none"?"block":"none";
}

function checkCalc(id){
  const c=CASES.find(x=>x.id===id);
  const inp=document.getElementById("calc-in");
  const fb=document.getElementById("calc-fb");
  if(!c||!c.calc||!inp||!fb)return false;
  const val=parseFloat(inp.value);
  if(isNaN(val)){
    fb.innerHTML=`<div class="calc-res bad">Please enter a number (${c.calc.unit}) first.</div>`;
    return false;
  }
  const ok=Math.abs(val-c.calc.ans)<=Math.max(c.calc.tol,0.01);
  if(ok){
    st.calcOk[id]=val;
    saveSt();
    fb.innerHTML=`<div class="calc-res ok">✔ Correct! (${val} ${c.calc.unit})<br><small>${c.calc.formula}</small></div>`;
    return true;
  }else{
    fb.innerHTML=`<div class="calc-res bad">✘ Not quite (${val} ${c.calc.unit}). Check your math or click <b>Formula</b>.<br><small>${c.calc.formula}</small></div>`;
    return false;
  }
}

function insertSBAR(){
  const ta=document.getElementById("why");
  if(!ta)return;
  if(!ta.value.trim()){
    ta.value="S: \nB: \nA: \nR: ";
  }
  ta.focus();
}

function act(a){
  const c=CASES[st.sel];
  if(c.calc && st.calcOk[c.id]===undefined){
    const ok=checkCalc(c.id);
    if(!ok){
      alert("Complete the Required Dosing / Rate Calculation in the amber box first before signing off.");
      return;
    }
  }
  const t=document.getElementById("why").value.trim();
  if(!t){
    alert("Write your clinical reasoning or SBAR note before signing off.");
    return;
  }
  st.res[c.id]={a,right:a===c.answer,t,ts:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};
  saveSt();
  draw();
}

function renderFeedback(c,r){
  const name={verify:"Verify & Sign (RPh)",modify:"Modify / Contact Prescriber",reject:"Reject / Do Not Dispense"};
  return `<div class="fb ${r.right?'right':'wrong'}">
    <h4>${r.right?'✔ Verified Correctly':'✘ Review Needed'}: You chose "${name[r.a]}" · Best action is "${name[c.answer]}"</h4>
    <div class="fb-box">
      <b>Clinical Breakdown &amp; Why in the Body</b>
      ${c.why}
    </div>
    ${c.calc?`<div class="fb-box"><b>Step-by-Step Math Verification</b>${c.calc.formula}</div>`:''}
    ${c.sbar?`<div class="fb-box"><b>Model Pharmacist SBAR / Sign-Off Note</b>${c.sbar}</div>`:''}
    <div class="fb-box">
      <b>Your Documented Note (${r.ts||'signed'})</b>
      ${r.t.replace(/</g,'&lt;')}
    </div>
    <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <button class="btn-sm" onclick="next()"><b>Next Order in Queue →</b></button>
      <button class="btn-sm" onclick="logIntervention(${c.id})">+ Log to My Intervention Log</button>
      <button class="btn-sm" onclick="delete st.res[${c.id}];delete st.calcOk[${c.id}];saveSt();draw()">Redo Order</button>
      <a class="btn-sm" href="${c.ref[1]}" target="_blank">Open Study Page: ${c.ref[0]} ↗</a>
    </div>
    <div id="log-msg-${c.id}" style="margin-top:6px;font-size:12px;font-weight:600;color:var(--ok)"></div>
  </div>`;
}

function logIntervention(id){
  const c=CASES.find(x=>x.id===id);
  if(!c)return;
  const areaMap={"L&D":"L&D","NICU/PICU":"NICU","Stroke":"Stroke","Anticoag":"Medical floor","ICU/Trauma":"ICU","ID/Floor":"Medical floor","IV Room":"IV room"};
  const entry={
    date:new Date().toISOString().slice(0,10),
    area:areaMap[c.svc]||"Other",
    cat:c.type==="IV room"?"Product or label (IV room)":(c.calc?"Dose":"Monitoring or levels"),
    drug:c.title,
    acc:"Yes",
    sev:c.stat?"High":"Moderate",
    note:(c.sbar||c.why).replace(/TEST, [A-Z ]+|SIM\d+|L&D \d+|NICU \d+|PICU \d+|MICU \d+|SICU \d+|CVICU \d+|ED [A-Za-z0-9 ]+|\d+ (East|West) \d+/g,"[patient]")
  };
  try{
    const K="intervention_log_v1";
    const rows=JSON.parse(localStorage.getItem(K)||"[]");
    rows.unshift(entry);
    localStorage.setItem(K,JSON.stringify(rows));
    const m=document.getElementById("log-msg-"+id);
    if(m)m.textContent="✔ Saved to your Intervention Log (zero patient identifiers).";
  }catch(e){}
}

function next(){
  const vis=visibleCases();
  if(!vis.length)return;
  const idx=vis.findIndex(x=>x.i===st.sel);
  st.sel=vis[(idx+1)%vis.length].i;
  draw();
}

draw();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intervention Log</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#1d2733;--muted:#5d6b7a;--line:#cfd6df;--bar:#1f3b5a;--accent:#2f6fb0;--ok:#1e7a46;--bad:#b3261e;--chip:#e3e9f1}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--panel:#1b222b;--ink:#e6ebf1;--muted:#9aa7b5;--line:#2c3642;--bar:#0f2238;--accent:#6aa5e0;--ok:#4cc184;--bad:#ff7b72;--chip:#232c37}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--bar);color:#fff;padding:10px 16px}header b{font-size:15px}header small{display:block;opacity:.8}
main{max-width:1000px;margin:0 auto;padding:12px 16px;display:grid;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
label{font-size:12px;color:var(--muted);display:grid;gap:3px}
input,select,textarea{font:inherit;padding:6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.full{grid-column:1/-1}
button{font:inherit;padding:7px 12px;border-radius:4px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.alt{background:none;color:var(--accent)}
.warn{color:var(--bad);font-size:12px}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:var(--chip);border-radius:6px;padding:8px 12px}.stat b{display:block;font-size:20px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header><b>Intervention Log</b><small>Count what you catch. No patient names, MRNs, room numbers or dates of birth. Entries stay in this browser only; export to CSV to keep a copy.</small></header>
<main>
<section class="panel">
<h3>New intervention</h3>
<form id="f">
<label>Date<input type="date" name="date" required></label>
<label>Area<select name="area"><option>L&amp;D</option><option>NICU</option><option>PICU</option><option>Pediatrics</option><option>ED</option><option>Trauma</option><option>Stroke</option><option>ICU</option><option>Medical floor</option><option>Surgical floor</option><option>IV room</option><option>Other</option></select></label>
<label>Category<select name="cat"><option>Dose</option><option>Renal adjustment</option><option>Duplication</option><option>Interaction</option><option>Allergy</option><option>Wrong route or form</option><option>IV compatibility or line</option><option>Product or label (IV room)</option><option>Missing therapy</option><option>Unnecessary therapy</option><option>IV to PO</option><option>Monitoring or levels</option><option>Drug information question</option><option>Other</option></select></label>
<label>Drug<input name="drug" required placeholder="for example enoxaparin"></label>
<label>Accepted?<select name="acc"><option>Yes</option><option>No</option><option>Pending</option></select></label>
<label>Severity if missed<select name="sev"><option>Low</option><option>Moderate</option><option>High</option></select></label>
<label class="full">What you recommended (no identifiers)<textarea name="note" rows="2" placeholder="for example CrCl 24: changed to 1 mg/kg once daily"></textarea></label>
<div class="full"><button>Add</button> <span class="warn" id="w"></span></div>
</form>
</section>
<section class="panel">
<h3>This month</h3>
<div class="stats" id="stats"></div>
</section>
<section class="panel">
<h3>All entries</h3>
<p><button class="alt" id="csv">Export CSV</button></p>
<div class="tablewrap"><table><thead><tr><th>Date</th><th>Area</th><th>Category</th><th>Drug</th><th>Accepted</th><th>Severity</th><th>Recommendation</th><th></th></tr></thead><tbody id="t"></tbody></table></div>
</section>
</main>
<script>
// ponytail: browser storage only; one device. Move to a shared store if she wants it on her phone too.
const K='intervention_log_v1';
let rows=[];try{rows=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){rows=[]}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(rows))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Block obvious identifiers: MRN-like digit runs and DOB-like dates in free text.
const looksPHI=s=>/\b\d{6,}\b/.test(s)||/\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/.test(s)||/\b(mrn|dob|room)\b/i.test(s);
const f=document.getElementById('f');f.date.valueAsDate=new Date();
f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));
 if(looksPHI(d.note+' '+d.drug)){document.getElementById('w').textContent='That looks like a patient identifier. Remove it before saving.';return}
 document.getElementById('w').textContent='';rows.unshift(d);save();f.note.value='';f.drug.value='';draw()};
function draw(){
 document.getElementById('t').innerHTML=rows.map((r,i)=>`<tr><td>${esc(r.date)}</td><td>${esc(r.area)}</td><td>${esc(r.cat)}</td><td>${esc(r.drug)}</td><td>${esc(r.acc)}</td><td>${esc(r.sev)}</td><td>${esc(r.note)}</td><td><button class="alt" onclick="del(${i})">Remove</button></td></tr>`).join('');
 const m=new Date().toISOString().slice(0,7),mine=rows.filter(r=>r.date.startsWith(m));
 const by={};mine.forEach(r=>by[r.cat]=(by[r.cat]||0)+1);
 const acc=mine.filter(r=>r.acc==='Yes').length;
 document.getElementById('stats').innerHTML=`<div class="stat"><b>${mine.length}</b>interventions</div><div class="stat"><b>${mine.length?Math.round(100*acc/mine.length):0}%</b>accepted</div>`+
  Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="stat"><b>${v}</b>${esc(k)}</div>`).join('');
}
function del(i){rows.splice(i,1);save();draw()}
document.getElementById('csv').onclick=()=>{const h=['date','area','cat','drug','acc','sev','note'];
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const b=new Blob([[h.join(','),...rows.map(r=>h.map(k=>q(r[k])).join(','))].join('\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='intervention_log.csv';a.click()};
draw();
</script>
</body>
</html>
